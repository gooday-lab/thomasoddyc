  <rect x="60" y="350" width="700" height="380" rx="14" fill="#1e293b" stroke="#334155"/>
  <polyline points="100,670 170,630 240,645 310,590 380,560 450,575 520,520 590,500 660,470 730,440" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linejoin="round"/>
  <text x="100" y="385" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#cbd5e1">Tren penjualan bulanan</text>
  <rect x="800" y="350" width="340" height="380" rx="14" fill="#1e293b" stroke="#334155"/>
  <g fill="#facc15">
