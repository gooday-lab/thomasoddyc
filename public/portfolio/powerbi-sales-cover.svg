    <text x="84" y="290" font-size="36" fill="#f8fafc" font-weight="700">Rp 6,25 M</text>
    <rect x="330" y="190" width="250" height="130" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="354" y="235" font-size="18" fill="#94a3b8">Total Profit</text>
    <text x="354" y="290" font-size="36" fill="#f8fafc" font-weight="700">Rp 2,30 M</text>
