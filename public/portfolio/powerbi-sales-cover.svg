  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <text x="60" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#facc15" font-weight="600">POWER BI · SALES DASHBOARD</text>
  <text x="60" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="46" fill="#f8fafc" font-weight="700">Sales performance, one source of truth</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="60" y="190" width="250" height="130" rx="14" fill="#1e293b" stroke="#334155"/>
